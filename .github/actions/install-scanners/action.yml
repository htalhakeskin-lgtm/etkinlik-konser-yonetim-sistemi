# Scanners as pinned, checksum-verified binaries instead of third-party actions (docs/standards/ci.md §7).
# The versions and checksums live only here. Tools are called by full path ($RUNNER_TEMP/bin/...);
# the PATH is left untouched.
name: Install scanners
description: Installs gitleaks and, on request, actionlint and zizmor into $RUNNER_TEMP/bin.

inputs:
  workflow-linters:
    description: Also install actionlint and zizmor ("true" or "false").
    default: "false"

runs:
  using: composite
  steps:
    - name: Install gitleaks
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
          | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
    - name: Install actionlint and zizmor
      if: inputs.workflow-linters == 'true'
      shell: bash
      run: |
        curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" \
          | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
        curl -sSfL -o "$RUNNER_TEMP/zizmor.tar.gz" \
          https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
        echo "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  $RUNNER_TEMP/zizmor.tar.gz" \
          | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP/bin" zizmor
