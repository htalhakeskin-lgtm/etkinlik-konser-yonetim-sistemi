# Dependency updates (docs/standards/git.md §9): weekly, grouped, with a release cooldown.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Held on the previous major on purpose (docs/07-tech-stack.md §7): TypeScript 7 waits for
    # typescript-eslint, Vitest 5 for Storybook's Vitest addon; @types/node follows the Node LTS in .nvmrc.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
      - dependency-name: vitest
        versions: [">=5"]
      - dependency-name: "@types/node"
        versions: [">=25"]
    commit-message:
      prefix: build
      prefix-development: build
      include: scope

  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    # Workflows and the local composite actions.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
