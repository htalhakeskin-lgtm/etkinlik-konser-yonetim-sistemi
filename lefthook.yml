# Commit hooks (docs/standards/git.md §8). They are a fast convenience; CI runs the same checks.
pre-commit:
  parallel: true
  commands:
    csharpier:
      glob: "*.{cs,csproj,props,targets,slnx}"
      run: dotnet csharpier format {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{ts,tsx,js,mjs,cjs,json,css,yml,yaml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    gitleaks:
      run: gitleaks git --staged --redact --no-banner

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    protect-main:
      # Changes reach main only through pull requests (R-03). The script reads the pushed refs
      # from stdin; an inline command would break on Windows, where Lefthook wraps it in sh -c "…".
      run: sh tools/git/protect-main.sh
      use_stdin: true
